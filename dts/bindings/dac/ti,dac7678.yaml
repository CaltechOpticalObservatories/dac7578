description: TI DAC7678 12-bit octal I2C DAC with 2.5 V internal reference

compatible: "ti,dac7678"

include: [dac-controller.yaml, i2c-device.yaml]

properties:
  "#io-channel-cells":
    const: 1

  ti,clear-mode:
    type: string
    enum:
      - "default"
      - "zero-scale"
      - "midscale"
      - "full-scale"
      - "disabled"
    description: |
      Optional clear-code register initialization. "disabled" disables the
      external CLR pin. If omitted, the driver leaves the clear-code register
      unchanged at init.

  ti,reference:
    type: string
    enum:
      - "external"
      - "internal-static"
      - "internal-flexible"
    description: |
      Reference configuration applied during init. "external" leaves the
      internal reference disabled. "internal-static" enables the internal
      reference using the static reference register. "internal-flexible"
      enables the flexible reference mode that keeps the reference powered
      regardless of DAC channel power-down state. If omitted, the driver leaves
      reference configuration unchanged at init.

  ti,reset-on-init:
    type: boolean
    description: |
      Send the software-reset command during Zephyr device initialization. This
      can disturb analog outputs after an MCU-only reboot, so it is opt-in.

io-channel-cells:
  - output
