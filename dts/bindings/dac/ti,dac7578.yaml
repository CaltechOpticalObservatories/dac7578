description: TI DAC7578 12-bit octal I2C DAC

compatible: "ti,dac7578"

include: [dac-controller.yaml, i2c-device.yaml]

properties:
  "#io-channel-cells":
    const: 1

  ti,clear-mode:
    type: string
    enum:
      - "default"
      - "zero-scale"
      - "midscale"
      - "full-scale"
      - "disabled"
    description: |
      Optional clear-code register initialization. "disabled" disables the
      external CLR pin in devices that support the DACx578 clear-code command.
      If omitted, the driver leaves the clear-code register unchanged at init.

  ti,reference:
    type: string
    enum:
      - "external"
    description: |
      DAC7578 uses the external supply/reference path; internal reference
      modes are only available on compatible DAC7678 devices. If omitted, the
      driver leaves reference configuration unchanged at init.

  ti,reset-on-init:
    type: boolean
    description: |
      Send the software-reset command during Zephyr device initialization. This
      can disturb analog outputs after an MCU-only reboot, so it is opt-in.

io-channel-cells:
  - output
